{% extends "base.html" %}

{% block title %}Sign Up | U-Share Notes{% endblock %}

{% block description %}
<meta name="description" content="Sign up for a U-Share Notes account.">
{% endblock %}

{% block navbar %}{% endblock %}

{% block content %}
<div class="signup-page">

    <h1 class="content-header">Sign Up</h1>

    <form method="post">
        {% csrf_token %}
        {{ form }}
        <button class="btn" type="submit">Sign Up</button>
    </form>

    <p class="signup-links">
        If you already have an account, log in
        <a href="{% url 'login' %}">here</a>.
        <br>
        (Or <a href="{% url 'home' %}">browse notes as Guest</a>)
    </p>

</div>
{% endblock %}
