{% extends "base.html" %}

{% block title %}Your Notes | U-Share Notes{% endblock %}

{% block description %}
    <meta name="description" content="View the notes you've shared.">
{% endblock %}

{% block content %}
    <h1>Your Notes</h1>
    {% if user.is_authenticated %}
        (list display of user's notes, allow editing)
    {% else %}
        <p>You are not logged in</p>
        <a href="{% url 'login' %}"><button class='btn'>Log In</button></a>
    {% endif %}
{% endblock %}
