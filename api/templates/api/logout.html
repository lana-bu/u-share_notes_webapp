<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout | u-share Notes</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #764ba2, #667eea);
            color: white;
        }
        .card {
            width: min(420px, calc(100% - 32px));
            background: rgba(255, 255, 255, 0.13);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 36px;
            text-align: center;
        }
        h1 { margin-bottom: 12px; font-size: 28px; }
        p { margin-bottom: 24px; color: #eef4ff; }
        .status { margin-bottom: 24px; padding: 16px; border-radius: 12px; background: rgba(255,255,255,0.12); }
        a.button {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 10px;
            background: white;
            color: #667eea;
            font-weight: 700;
            text-decoration: none;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Logging out...</h1>
        <div id="status" class="status">Please wait while we sign you out.</div>
        <a id="loginLink" class="button hidden" href="/login/">Return to Login</a>
    </div>

    <script>
        const apiUrl = '/api';
        const token = localStorage.getItem('authToken');
        const statusDiv = document.getElementById('status');
        const loginLink = document.getElementById('loginLink');

        function finish(message) {
            statusDiv.textContent = message;
            loginLink.classList.remove('hidden');
        }

        function clearSession() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userId');
            localStorage.removeItem('userEmail');
        }

        async function logout() {
            if (!token) {
                clearSession();
                finish('You are already logged out.');
                return;
            }

            try {
                const response = await fetch(`${apiUrl}/logout/`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Token ${token}`
                    }
                });
                const data = await response.json();
                clearSession();
                if (response.ok) {
                    finish(data.message || 'Logged out successfully.');
                } else {
                    finish(data.error || 'Logout completed.');
                }
            } catch (error) {
                clearSession();
                finish('Logout failed to contact the server. Session cleared locally.');
            }
        }

        window.addEventListener('load', logout);
    </script>
</body>
</html>
