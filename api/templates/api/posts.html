<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Posts | u-share Notes</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f6ff;
            color: #222;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 32px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        header h1 { margin: 0; font-size: 24px; }
        header .actions { display: flex; gap: 12px; align-items: center; }
        header .actions span { font-size: 14px; opacity: 0.9; }
        header a {
            display: inline-block;
            padding: 10px 18px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
        }
        .container {
            max-width: 1000px;
            margin: 28px auto;
            padding: 0 24px 40px;
        }
        .section {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 14px 40px rgba(102, 126, 234, 0.12);
        }
        .section h2 { margin-top: 0; font-size: 22px; }
        .posts-grid {
            display: grid;
            gap: 18px;
            margin-top: 18px;
        }
        .post-card {
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #e7ebff;
            background: #fbfdff;
        }
        .post-card h3 { margin: 0 0 10px; font-size: 18px; }
        .post-card p { margin: 0 0 10px; color: #505d7d; }
        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 13px;
            color: #7b86aa;
        }
        .meta span { background: #eef1ff; padding: 6px 12px; border-radius: 999px; }
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #66708c;
            border: 2px dashed #d7dcf3;
            border-radius: 16px;
            background: #f7f9ff;
        }
        .message {
            margin-bottom: 18px;
            padding: 16px;
            border-radius: 14px;
            display: none;
        }
        .message.error { background: #ffe8e8; color: #8b1a1a; }
        .message.success { background: #e4f8e8; color: #1a6a35; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>u-share Notes</h1>
            <div class="actions">
                <span id="userEmail"></span>
            </div>
        </div>
        <div>
            <a href="/logout/">Logout</a>
        </div>
    </header>

    <div class="container">
        <div id="message" class="message"></div>
        <div class="section">
            <h2>Your Personal Posts</h2>
            <div id="postsGrid" class="posts-grid">
                <div class="empty-state">Loading your posts…</div>
            </div>
        </div>
    </div>

    <script>
        const apiUrl = '/api';
        const token = localStorage.getItem('authToken');
        const userId = localStorage.getItem('userId');
        const userEmail = localStorage.getItem('userEmail');
        const postsGrid = document.getElementById('postsGrid');
        const messageDiv = document.getElementById('message');
        const emailSpan = document.getElementById('userEmail');

        if (!token || !userId) {
            window.location.href = '/login/';
        }

        if (userEmail) {
            emailSpan.textContent = userEmail;
        }

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        function clearMessage() {
            messageDiv.style.display = 'none';
        }

        function renderPosts(posts) {
            if (!posts.length) {
                postsGrid.innerHTML = '<div class="empty-state">No posts found. Use the API to upload your notes, then return here to see them.</div>';
                return;
            }

            postsGrid.innerHTML = posts.map(post => `
                <article class="post-card">
                    <h3>${post.title}</h3>
                    <p>${post.description || 'No description provided.'}</p>
                    <div class="meta">
                        <span>${post.course_number}</span>
                        <span>${post.course_name}</span>
                        <span>${post.instructor_name}</span>
                        <span>${new Date(post.created_at).toLocaleDateString()}</span>
                    </div>
                </article>
            `).join('');
        }

        async function loadPosts() {
            clearMessage();
            try {
                const response = await fetch(`${apiUrl}/posts/?user=${userId}`, {
                    headers: {
                        'Authorization': `Token ${token}`
                    }
                });
                const data = await response.json();
                if (response.ok) {
                    renderPosts(data.results || []);
                } else {
                    showMessage(data.detail || 'Failed to load posts.', 'error');
                }
            } catch (error) {
                showMessage('Unable to reach the server. Is Django running?', 'error');
                postsGrid.innerHTML = '<div class="empty-state">Unable to load posts.</div>';
            }
        }

        window.addEventListener('load', loadPosts);
    </script>
</body>
</html>
